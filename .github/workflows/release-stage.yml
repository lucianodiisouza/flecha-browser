name: Release build stage

on:
  workflow_call:
    inputs:
      stage:
        type: number
        required: true
      previous:
        type: number
        required: true
      last:
        type: boolean
        default: false
      platforms:
        type: string
        required: true
    outputs:
      incomplete:
        description: The stage needs another Chromium build job.
        value: ${{ jobs.build.outputs.incomplete }}
      published:
        description: The monitor confirmed that the publisher succeeded.
        value: ${{ jobs.confirm-publication.outputs.published }}

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: ${{ matrix.platform }} stage ${{ inputs.stage }}
    outputs:
      incomplete: ${{ steps.handoff.outputs.incomplete }}
      artifact: ${{ format('{0}-attempt-{1}-job-{2}', steps.portable.outputs.package || steps.compile.outputs.package, github.run_attempt, job.check_run_id) }}
      artifact-id: ${{ steps.package.outputs.artifact-id }}
      build-attempt: ${{ steps.handoff.outputs.build-attempt }}
      build-id: ${{ job.check_run_id }}
      platform: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
      FLECHA_STAGE: ${{ inputs.stage }}
      # Owner-selected total optional reuse budget across both searches.
      FLECHA_REUSE_BUDGET_MINUTES: '60'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Record stage start
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'FLECHA_STAGE_STARTED=' + Date.now() + '\n')"
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: shell-and-host
          path: shell-and-host
      - name: Restore built shell and host
        shell: bash
        run: tar -xzf shell-and-host/shell-and-host.tar.gz
      - name: Try verified portable package before Chromium setup
        id: portable
        if: inputs.stage == 0 && runner.os != 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
          FLECHA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node chromium/scripts/ci-release.mjs portable
      - name: Select Xcode before removing unused SDKs
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - name: Reclaim unused hosted tooling
        if: steps.portable.outputs.package == ''
        run: node chromium/scripts/ci-cleanup.mjs
      - name: Verify selected macOS toolchain survived cleanup
        if: runner.os == 'macOS'
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - uses: actions/setup-python@v7
        if: steps.portable.outputs.package == ''
        with:
          python-version: '3.11'
      - name: Install Chromium Windows SDK
        if: runner.os == 'Windows' && steps.portable.outputs.package == ''
        shell: pwsh
        run: ./chromium/scripts/ci-windows-sdk.ps1
      - name: Restore previous checkpoint
        if: inputs.stage != 0
        uses: actions/download-artifact@v8
        with:
          name: checkpoint-${{ matrix.platform }}-${{ inputs.previous }}
          path: checkpoint
      - name: Unpack previous checkpoint
        if: inputs.stage != 0
        run: node chromium/scripts/ci-release.mjs restore
      - name: Install packaging dependencies
        if: runner.os == 'macOS'
        run: npm ci
      - name: Read Chromium revision for Linux dependency checks
        id: pin
        if: runner.os == 'Linux' && inputs.stage == 0 && steps.portable.outputs.package == ''
        run: echo "chromium=$(cat chromium/CHROMIUM_VERSION)" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned dependency installer before source preparation
        if: steps.pin.outputs.chromium != ''
        uses: actions/checkout@v7
        with:
          repository: chromium/chromium
          ref: ${{ steps.pin.outputs.chromium }}
          path: chromium-deps
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /build/install-build-deps.sh
            /build/install-build-deps.py
            /build/linux/install-chromeos-fonts.py
      - name: Verify and install Chromium Linux dependencies within the stage allowance
        if: runner.os == 'Linux' && steps.portable.outputs.package == ''
        env:
          FLECHA_DEPS_ROOT: ${{ steps.pin.outputs.chromium != '' && 'chromium-deps' || '' }}
        run: node chromium/scripts/ci-release.mjs dependencies
      - name: Prepare Chromium source and toolchains, falling back to a cold checkpoint on low disk
        id: prepare
        if: inputs.stage == 0 && steps.portable.outputs.package == ''
        env:
          GH_TOKEN: ${{ github.token }}
          FLECHA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FLECHA_REUSE_SPENT_MS: ${{ steps.portable.outputs.spent-ms }}
        run: node chromium/scripts/ci-release.mjs prepare
      - name: Compile and package
        id: compile
        if: inputs.stage != 0 || steps.prepare.outputs.compile == 'true'
        shell: bash
        run: |
          export CHROMIUM_SRC="$RUNNER_WORKSPACE/flecha-chromium/src"
          export FLECHA_DISK="$RUNNER_WORKSPACE/flecha-chromium"
          node chromium/scripts/ci-release.mjs build
      - name: Upload completed platform package
        id: package
        if: steps.portable.outputs.package != '' || steps.compile.outputs.package != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ format('{0}-attempt-{1}-job-{2}', steps.portable.outputs.package || steps.compile.outputs.package, github.run_attempt, job.check_run_id) }}
          path: release/*
          overwrite: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 35
      - name: Index the package for exact-name reuse lookup
        if: runner.os != 'macOS' && steps.package.outputs.artifact-id != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.portable.outputs.package || steps.compile.outputs.package }}-packages
          path: release/${{ matrix.platform }}.json
          overwrite: true
          if-no-files-found: error
          retention-days: 35
      - name: Save checkpoint
        id: checkpoint
        if: steps.portable.outputs.package == '' && steps.compile.outputs.package == ''
        run: node chromium/scripts/ci-release.mjs checkpoint
      - uses: actions/upload-artifact@v7
        id: checkpoint-upload
        if: steps.checkpoint.outputs.complete == 'false'
        with:
          name: checkpoint-${{ matrix.platform }}-${{ inputs.stage }}
          path: ${{ steps.checkpoint.outputs.archive }}
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 35
      - name: Require an uploaded checkpoint or package
        id: handoff
        shell: bash
        env:
          CHECKPOINT_ID: ${{ steps.checkpoint-upload.outputs.artifact-id }}
          PACKAGE_ID: ${{ steps.package.outputs.artifact-id }}
        run: |
          if [[ -n "$CHECKPOINT_ID" && -z "$PACKAGE_ID" ]]; then
            echo 'incomplete=true' >> "$GITHUB_OUTPUT"
          elif [[ -n "$PACKAGE_ID" && -z "$CHECKPOINT_ID" ]]; then
            echo 'incomplete=false' >> "$GITHUB_OUTPUT"
            echo "build-attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          else
            echo '::error::Expected exactly one uploaded checkpoint or package.'
            exit 1
          fi
      - name: Index resumable native checkpoint after successful upload
        if: steps.checkpoint.outputs.reuse-key != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: reuse-${{ matrix.platform }}-${{ steps.checkpoint.outputs.reuse-key }}-${{ inputs.stage }}
          path: reuse.json
          if-no-files-found: error
          overwrite: true
          retention-days: 35
      - name: Delete superseded checkpoint after successful handoff
        if: inputs.stage != 0 && !inputs.last && steps.checkpoint.outputs.complete == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_NAME: checkpoint-${{ matrix.platform }}-${{ inputs.previous }}
        run: |
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PREVIOUS_NAME" --paginate --jq ".artifacts[] | select(.name == \"$PREVIOUS_NAME\") | .id")
          if [ -n "$artifact_id" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          fi
      - name: Create optional native snapshot after required release uploads
        id: native
        if: ${{ !cancelled() && (inputs.stage != 0 || steps.prepare.outputs.compile == 'true') && (runner.os == 'macOS' || failure()) }}
        continue-on-error: true
        run: node chromium/scripts/ci-release.mjs native-checkpoint
      - name: Preserve native outputs for later nightlies and packaging recovery
        if: ${{ !cancelled() && steps.native.outputs.native-key != '' }}
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(steps.native.outputs.upload-minutes) }}
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}-${{ steps.native.outputs.native-key }}
          path: ${{ steps.native.outputs.archive }}
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 35
      - name: Report an unfinished final stage
        if: inputs.last && steps.checkpoint.outputs.complete == 'false'
        run: exit 1

  confirm-publication:
    name: Monitor ${{ needs.build.outputs.platform }} publication
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.incomplete != 'true'
    runs-on: ubuntu-24.04
    # 120 minutes for the watch, plus dispatch and cancellation time.
    timeout-minutes: 130
    outputs:
      published: ${{ steps.watch.outputs.published }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Hand the package to the publisher
        id: publisher
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INCOMPLETE: ${{ needs.build.outputs.incomplete }}
          PACKAGE_ARTIFACT: ${{ needs.build.outputs.artifact }}
          PACKAGE_ID: ${{ needs.build.outputs.artifact-id }}
          BUILD_ATTEMPT: ${{ needs.build.outputs.build-attempt }}
          BUILD_ID: ${{ needs.build.outputs.build-id }}
          RELEASE_PLATFORM: ${{ needs.build.outputs.platform }}
          MONITOR_ID: ${{ job.check_run_id }}
        run: |
          if [[ "$INCOMPLETE" != false || -z "$PACKAGE_ID" || -z "$BUILD_ATTEMPT" || -z "$BUILD_ID" ]]; then
            echo '::error::Missing package handoff from the build job.'
            exit 1
          fi
          run_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/publish-nightly-platform.yml/dispatches" \
            -H 'X-GitHub-Api-Version: 2026-03-10' -f "ref=$DEFAULT_BRANCH" \
            -f "inputs[build_run]=$GITHUB_RUN_ID" -f "inputs[platform]=$RELEASE_PLATFORM" \
            -f "inputs[build_attempt]=$BUILD_ATTEMPT" -f "inputs[build_id]=$BUILD_ID" \
            -f "inputs[monitor_attempt]=$GITHUB_RUN_ATTEMPT" -f "inputs[artifact_id]=$PACKAGE_ID" \
            -f "inputs[monitor_id]=$MONITOR_ID" \
            -f "inputs[artifact]=$PACKAGE_ARTIFACT" --jq '.workflow_run_id')
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo '::error::The publisher did not return a workflow run ID.'
            exit 1
          fi
          printf 'run-id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
      - name: Confirm publication succeeded
        id: watch
        # One publisher allowance to queue and one to download, verify and publish.
        timeout-minutes: 120
        env:
          PUBLISH_RUN_ID: ${{ steps.publisher.outputs.run-id }}
        run: |
          gh run watch "$PUBLISH_RUN_ID" --repo "$GITHUB_REPOSITORY" --compact --exit-status
          echo 'published=true' >> "$GITHUB_OUTPUT"
      - name: Cancel an unfinished publisher after a failed wait
        if: ${{ (failure() || cancelled()) && steps.publisher.outputs.run-id != '' }}
        env:
          PUBLISH_RUN_ID: ${{ steps.publisher.outputs.run-id }}
        continue-on-error: true
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISH_RUN_ID" --jq '.status')
          if [ "$status" != "completed" ]; then
            gh run cancel "$PUBLISH_RUN_ID" --repo "$GITHUB_REPOSITORY"
          fi
