name: Release platform

# A platform continues while it has a checkpoint. A finished stage hands off
# its package to the publisher and the remaining stages are skipped.
on:
  workflow_call:
    inputs:
      platforms:
        description: A one-entry list from chromium/build/ci-platforms.json.
        type: string
        required: true

jobs:
  source:
    uses: ./.github/workflows/release-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      stage: 0
      previous: 0
      platforms: ${{ inputs.platforms }}

  build-1:
    needs: source
    if: needs.source.outputs.incomplete == 'true'
    uses: ./.github/workflows/release-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      stage: 1
      previous: 0
      platforms: ${{ inputs.platforms }}

  build-2:
    needs: build-1
    if: needs.build-1.outputs.incomplete == 'true'
    uses: ./.github/workflows/release-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      stage: 2
      previous: 1
      platforms: ${{ inputs.platforms }}

  build-3:
    needs: build-2
    if: needs.build-2.outputs.incomplete == 'true'
    uses: ./.github/workflows/release-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      stage: 3
      previous: 2
      platforms: ${{ inputs.platforms }}

  build-4:
    needs: build-3
    if: needs.build-3.outputs.incomplete == 'true'
    uses: ./.github/workflows/release-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      stage: 4
      previous: 3
      platforms: ${{ inputs.platforms }}

  build-5:
    needs: build-4
    if: needs.build-4.outputs.incomplete == 'true'
    uses: ./.github/workflows/release-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      stage: 5
      previous: 4
      platforms: ${{ inputs.platforms }}

  build-6:
    needs: build-5
    if: needs.build-5.outputs.incomplete == 'true'
    uses: ./.github/workflows/release-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      stage: 6
      previous: 5
      platforms: ${{ inputs.platforms }}

  build-7:
    needs: build-6
    if: needs.build-6.outputs.incomplete == 'true'
    uses: ./.github/workflows/release-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      stage: 7
      previous: 6
      platforms: ${{ inputs.platforms }}

  build-8:
    needs: build-7
    if: needs.build-7.outputs.incomplete == 'true'
    uses: ./.github/workflows/release-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      stage: 8
      previous: 7
      platforms: ${{ inputs.platforms }}

  build-9:
    needs: build-8
    if: needs.build-8.outputs.incomplete == 'true'
    uses: ./.github/workflows/release-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      stage: 9
      previous: 8
      platforms: ${{ inputs.platforms }}

  build-10:
    needs: build-9
    if: needs.build-9.outputs.incomplete == 'true'
    uses: ./.github/workflows/release-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      stage: 10
      previous: 9
      platforms: ${{ inputs.platforms }}
      last: true

  missing-publication:
    needs: [source, build-1, build-2, build-3, build-4, build-5, build-6, build-7, build-8, build-9, build-10]
    if: ${{ !cancelled() && !contains(needs.*.outputs.published, 'true') }}
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Fail if the stage chain stopped without a confirmed publication
        run: exit 1
